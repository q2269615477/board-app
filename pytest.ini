[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q
markers =
    browser: real Chromium browser smoke gate; run with -m browser and install Playwright/Chromium first
norecursedirs =
    .git
    .pytest_cache
    __pycache__
    venv
    data
    backup
    tmp
    scripts
    static
