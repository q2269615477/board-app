<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>极简测试</title>
<style>
* {margin:0;padding:0;box-sizing:border-box}
html,body {width:100%;height:100vh;overflow:hidden;background:#131722;color:#d1d4dc;font-family:sans-serif}
#app {display:flex;flex-direction:column;height:100%}
#nav {width:280px;min-width:200px;background:#1a1e29;border-right:1px solid #2a2e39;overflow-y:auto;flex-shrink:0;padding:10px}
#kline {flex:1;background:#131722;display:flex;align-items:center;justify-content:center;font-size:18px;color:#787b86}
.item {padding:6px 10px;border-bottom:1px solid #2a2e39;cursor:pointer;font-size:12px}
.item:hover {background:#1e2230}
.cat {background:#2962ff;padding:4px 8px;margin:6px 0;border-radius:3px;font-weight:600;font-size:12px}
#status {position:fixed;top:8px;right:8px;background:rgba(0,0,0,.7);padding:4px 8px;border-radius:3px;font-size:10px;color:#26a69a;max-width:300px}
</style></head>
<body>
<div id="status">初始化...</div>
<div id="app">
  <div id="nav">
    <div class="cat">医疗板块</div>
    <div class="item">BK1499 医美服务</div>
    <div class="item">BK1600 医药研发外包</div>
    <div class="item">BK1566 检测服务</div>
    <div class="cat">科技板块</div>
    <div class="item">BK1135 人工智能</div>
    <div class="item">BK1136 芯片概念</div>
    <div class="item">BK1137 云计算</div>
  </div>
  <div id="kline">K线图区域（测试）</div>
</div>
<script>
(function(){
  var s = document.getElementById('status');
  s.textContent = 'window.innerWidth = ' + window.innerWidth + ', .innerHeight = ' + window.innerHeight + ', #app = ' + document.getElementById('app').offsetHeight + 'px';
  
  // 测试 fetch
  fetch('/api/kline/index/sh000001?period=1d')
    .then(r => r.json())
    .then(d => s.textContent += ' | API: ' + d.count + ' 条')
    .catch(e => s.textContent += ' | API错误: ' + e.message);
})();
</script>
</body>
</html>
