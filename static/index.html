<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Stock Canvas</title>
<link rel="stylesheet" href="/static/js/klinecharts-pro.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;background:#131722;color:#d1d4dc;height:100vh;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
#toolbar{display:flex;align-items:center;gap:10px;padding:6px 14px;border-bottom:1px solid #2a2e39;background:#1a1e29;flex-shrink:0;font-size:12px}
#main{display:flex;flex:1;overflow:hidden}
/* 左侧 */
#nav-panel{width:280px;min-width:200px;max-width:400px;border-right:1px solid #2a2e39;overflow-y:auto;flex-shrink:0;position:relative;transition:width .25s ease,min-width .25s ease}
#nav-panel-toggle{position:absolute;top:50%;right:0;transform:translateY(-50%);width:16px;height:48px;background:#1a1e29;border:1px solid #2a2e39;border-right:0;border-radius:3px 0 0 3px;cursor:pointer;color:#434651;font-size:9px;display:flex;align-items:center;justify-content:center;z-index:10;transition:background .12s}
#nav-panel-toggle:hover{color:#d1d4dc;background:#2962ff;border-color:#2962ff}
#nav-expand-btn{display:none;position:absolute;left:0;top:50%;transform:translateY(-50%);width:16px;height:48px;background:#1a1e29;border:1px solid #2a2e39;border-left:0;border-radius:0 3px 3px 0;cursor:pointer;color:#434651;font-size:9px;align-items:center;justify-content:center;z-index:10;transition:background .12s}
#nav-expand-btn:hover{background:#2962ff;color:#d1d4dc}
.nav-collapsed #nav-panel{width:0!important;min-width:0!important;overflow:hidden;border-right:0}
.nav-collapsed #splitter{display:none}
.nav-collapsed #nav-expand-btn{display:flex}
.nav-collapsed #nav-panel-toggle{display:none}
.nav-collapsed #floating-cons{left:0}
.nav-header{padding:7px 10px;font-size:11px;font-weight:500;border-bottom:1px solid #2a2e39;background:#1a1e29;position:sticky;top:0;z-index:1}
.cat-item{padding:5px 10px;display:flex;align-items:center;border-bottom:1px solid #1e2230;cursor:pointer;font-size:12px;user-select:none}
.cat-item:hover{background:#1e2230}
.cat-item .arrow{width:14px;font-size:9px;color:#434651;margin-right:4px}
.cat-item .count{font-size:10px;color:#434651;margin-left:auto}
.cat-item.active{background:#2962ff;color:#fff}
.cat-item.active .count{color:#a0b4ff}
.collapsed{display:none}
.board-item{padding:4px 10px 4px 22px;font-size:11px;border-bottom:1px solid #1a1e2e;cursor:pointer;display:flex;justify-content:space-between;user-select:none}
.board-item:hover{background:#1e2230}
.board-item.active{background:#2a2e39}
.board-item .cons-wrap{display:none}
.board-item.expanded .cons-wrap{display:block}
.cons-list{background:#161a23;padding:2px 0}
.cons-item{display:flex;padding:2px 24px 2px 30px;font-size:10px;color:#787b86;gap:8px;cursor:pointer}
.cons-item:hover{color:#d1d4dc;background:#1e222d}
.cons-item .cons-code{color:#434651;min-width:56px}
.cons-item .cons-name{flex:1;overflow:hidden;text-overflow:ellipsis}
.board-item .code{font-size:9px;color:#434651}
.board-item.type-i{color:#4fc3f7}
.board-item.type-c{color:#ffb74d}
.board-item.type-i:hover{background:#0d2b45}
.board-item.type-c:hover{background:#2a1f0a}
.board-item .board-chg{font-size:9px;margin-left:auto;padding-left:4px;font-weight:500;min-width:36px;text-align:right}
.board-item .board-chg.up{color:#ef5350}.board-item .board-chg.down{color:#26a69a}
.sort-btn{font-size:9px;padding:1px 6px;border:1px solid #2a2e39;border-radius:3px;cursor:pointer;color:#787b86;margin-left:6px;background:transparent}
.sort-btn:hover{color:#d1d4dc;border-color:#787b86}
.sort-btn.active{color:#2962ff;border-color:#2962ff}
.cat-sort{font-size:10px;cursor:pointer;color:#434651;margin-left:4px;padding:0 2px;border-radius:2px;line-height:1;flex-shrink:0}
.cat-sort:hover{color:#d1d4dc;background:#2a2e39}
.cat-sort.active{color:#2962ff}
.fcons-pct{font-size:9px;text-align:right;min-width:36px;font-weight:500}
#floating-cons .fcons-item .fcons-pct.up{color:#ef5350}#floating-cons .fcons-item .fcons-pct.down{color:#26a69a}
#splitter{cursor:col-resize}
#splitter:hover{background:#2962ff}
/* 右侧 */
#content{flex:1;display:flex;flex-direction:column;overflow:hidden;transition:margin-right .25s ease}
body.sess-side-on #content{margin-right:372px}
#price-bar{display:flex;align-items:center;gap:12px;padding:5px 14px;border-bottom:1px solid #2a2e39;font-size:11px;flex-shrink:0;color:#787b86}
#price-bar .name{font-size:13px;font-weight:500;color:#d1d4dc}
#price-bar .price{font-size:20px;font-weight:400}
#price-bar .price.up{color:#ef5350}#price-bar .price.down{color:#26a69a}
/* 图表工具栏 — 常驻样式 */
#chart-bar{display:flex;align-items:center;gap:3px;padding:2px 8px;border-bottom:1px solid #2a2e39;background:#1a1e29;flex-shrink:0;font-size:10px;flex-wrap:wrap}
.chart-bar-btn{padding:2px 6px;border:1px solid #2a2e39;border-radius:3px;cursor:pointer;background:transparent;color:#787b86;font-size:10px;white-space:nowrap}
.chart-bar-btn:hover,.chart-bar-btn.active{background:#2962ff;color:#fff;border-color:#2962ff}
.chart-bar-btn.drawing{color:#f39c12;border-color:#5a4410}
.chart-bar-btn.drawing:hover,.chart-bar-btn.drawing.active{background:#f39c12;color:#000;border-color:#f39c12}
.chart-bar-btn.vol-on{color:#26a69a;border-color:#1a5a4e}
.chart-bar-btn.vol-on:hover{background:#26a69a;color:#fff}
.chart-bar-sep{width:1px;height:18px;background:#2a2e39;margin:0 4px}
.chart-bar-label{color:#434651;font-size:10px;margin-right:2px}
#chart-box{flex:1;min-height:0;position:relative}
#chart-box .placeholder{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#434651;font-size:14px;text-align:center}
/* 指标浮层 — 图表右上角 */
#indicator-float{position:absolute;top:6px;right:8px;z-index:10;display:flex;gap:4px;flex-wrap:wrap;max-width:50%;justify-content:flex-end}
.ind-float-btn{display:inline-flex;align-items:center;gap:2px;padding:2px 6px 2px 8px;border-radius:3px;font-size:9px;color:#d1d4dc;background:rgba(26,30,41,0.85);border:1px solid #2a2e39;cursor:default;white-space:nowrap}
.ind-float-btn .ind-close{color:#ef5350;cursor:pointer;margin-left:3px;padding:0 2px;font-size:11px}
.ind-float-btn .ind-close:hover{color:#ff4444}
/* 搜索 */
#search-wrap{position:fixed;bottom:16px;right:16px;z-index:100}
#search-input{width:240px;padding:6px 10px;border:1px solid #2a2e39;border-radius:4px;background:#1a1e29;color:#d1d4dc;font-size:12px;outline:none}
#search-input:focus{border-color:#2962ff}
#search-results{position:absolute;bottom:36px;right:0;width:280px;max-height:320px;overflow-y:auto;background:#1a1e29;border:1px solid #2a2e39;border-radius:4px;display:none}
#search-results.show{display:block}
.search-item{padding:4px 10px;cursor:pointer;font-size:11px;display:flex;justify-content:space-between}
.search-item:hover,.search-item.selected{background:#2962ff}
/* KLineChart Pro 容器高度 */
.klinecharts-pro{height:100%!important;}
.klinecharts-pro-content{height:calc(100% - 38px)!important;}
#pro-container{width:100%;height:100%;position:relative;}
/* 指数快捷栏 */
#index-bar{display:flex;align-items:stretch;gap:0;overflow-x:auto;overflow-y:hidden;flex:1;scrollbar-width:none;cursor:grab;user-select:none}
#index-bar::-webkit-scrollbar{display:none}
#index-bar:active{cursor:grabbing}
.idx-group{display:flex;align-items:stretch;border-right:1px solid #2a2e39;padding:0 2px}
.idx-group:last-child{border-right:none}
.idx-label{display:flex;align-items:center;padding:0 3px;color:#434651;font-size:9px;font-weight:600;white-space:nowrap}
.idx-item{display:flex;align-items:center;gap:2px;padding:0 5px;cursor:pointer;border-radius:2px;position:relative;transition:all 0.1s;white-space:nowrap;font-size:10px;height:100%}
.idx-item:hover{background:#2a2e39}
.idx-item.active{background:#2962ff}
.idx-item .name{color:#d1d4dc;font-size:10px}
.idx-item .price{font-size:10px;font-weight:600;min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.idx-item .price.up{color:#ef5350}.idx-item .price.down{color:#26a69a}.idx-item .price.flat{color:#787b86}
.idx-del{position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:#ef5350;color:#fff;font-size:7px;line-height:12px;text-align:center;cursor:pointer;display:none;z-index:10;border:1px solid #131722}
.idx-item:hover .idx-del{display:block}
/* 右键菜单 */
#ctx-menu{display:none;position:fixed;background:#1a1e29;border:1px solid #2a2e39;border-radius:4px;z-index:200;min-width:160px;padding:4px 0}
#ctx-menu.show{display:block}
.ctx-item{padding:5px 12px;font-size:11px;color:#d1d4dc;cursor:pointer}
.ctx-item:hover{background:#2962ff}
.ctx-sep{height:1px;background:#2a2e39;margin:3px 8px}
/* 弹窗 */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:300}
#modal-overlay.show{display:flex;align-items:center;justify-content:center}
#modal-box{background:#1a1e29;border:1px solid #2a2e39;border-radius:8px;padding:20px;min-width:320px;max-width:480px;max-height:80vh;overflow-y:auto}
#modal-box h3{font-size:14px;margin-bottom:12px;color:#d1d4dc}
#modal-box label{display:block;font-size:11px;color:#787b86;margin:8px 0 4px}
#modal-box input[type=color]{width:40px;height:28px;border:1px solid #2a2e39;border-radius:3px;background:transparent;cursor:pointer;vertical-align:middle}
#modal-box input[type=number]{width:60px;padding:4px 6px;border:1px solid #2a2e39;border-radius:3px;background:#131722;color:#d1d4dc;font-size:11px}
#modal-box .modal-btn{padding:5px 14px;border:1px solid #2962ff;border-radius:3px;cursor:pointer;background:#2962ff;color:#fff;font-size:11px;margin-top:12px}
#modal-box .modal-btn:hover{background:#1a4fbf}
.signal-row{padding:3px 10px;font-size:11px;border-bottom:1px solid #1e2230}
.signal-date{color:#434651}
.signal-badge{padding:0 4px;border-radius:2px;font-size:10px;margin:0 4px}
.signal-badge.buy{background:#ef5350;color:#fff}
.signal-badge.sell{background:#26a69a;color:#fff}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#2962ff;color:#fff;padding:8px 20px;border-radius:4px;font-size:12px;z-index:500;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
.toast-bar{position:fixed;top:36px;left:50%;transform:translateX(-50%);background:#1e222d;border:1px solid #ef5350;border-radius:4px;color:#d1d4dc;font-size:11px;padding:4px 12px;z-index:999;display:none}
.toast-bar.show{display:block}
.toast-bar a{color:#2962ff;cursor:pointer;text-decoration:underline}
/* 二级浮层面板 */
#floating-cons{position:fixed;left:280px;top:36px;width:240px;max-height:calc(100vh - 60px);overflow-y:auto;background:#161a23;border:1px solid #2a2e39;border-radius:4px;z-index:200;display:none;font-size:11px;box-shadow:2px 2px 12px rgba(0,0,0,.4)}
#floating-cons.show{display:block}
#floating-cons .fcons-header{padding:6px 10px;color:#434651;font-size:10px;border-bottom:1px solid #2a2e39;position:sticky;top:0;background:#161a23;z-index:1;display:flex;align-items:center;gap:4px}
#floating-cons .fcons-header .fcons-title{flex:1}
#floating-cons .fcons-header .fcons-btn{background:none;border:1px solid #2a2e39;border-radius:3px;color:#787b86;cursor:pointer;font-size:9px;padding:1px 5px;line-height:1.4}
#floating-cons .fcons-header .fcons-btn:hover{background:#1e222d;color:#d1d4dc}
#floating-cons .fcons-header .fcons-btn.active{background:#2962ff20;border-color:#2962ff;color:#2962ff}
#floating-cons .fcons-sort-indicator{font-size:9px;color:#787b86;margin-left:2px}
#floating-cons .fcons-item{display:flex;padding:5px 10px;cursor:pointer;gap:6px;align-items:center}
#floating-cons .fcons-item:hover{background:#1e222d}
#floating-cons .fcons-item .fcons-code{color:#434651;min-width:56px}
#floating-cons .fcons-item .fcons-name{flex:1;overflow:hidden;text-overflow:ellipsis;color:#d1d4dc}
#floating-cons .fcons-item .fcons-cap{color:#d1d4dc;font-size:9px;text-align:right;min-width:40px}
#floating-cons .fcons-item .fcons-pct{color:#434651;font-size:9px;text-align:right;min-width:36px}
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
  <button class="tab-btn active" id="tab-classify">分类导航</button>
  <div id="index-bar"></div>
</div>

  <div id="main">
    <div id="nav-panel"><div class="nav-header">加载分类...</div><button id="nav-panel-toggle" onclick="toggleNavPanel()" title="折叠板块导航">◀</button></div>
    <div id="splitter"></div>
    <div id="content">
      <div id="pro-container">
        <div class="placeholder" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#434651;font-size:14px;text-align:center">点击左侧板块查看K线</div>
      </div>
    </div>
  </div>
  <!-- 左侧面板展开按钮（折叠态显示） -->
  <button id="nav-expand-btn" onclick="toggleNavPanel()" title="展开板块导航">▶</button>
</div>
<div id="search-wrap">
  <input id="search-input" placeholder="搜索板块/代码">
  <div id="search-results"></div>
</div>
<div id="floating-cons"></div>
<!-- 信号列表 -->
<div id="signal-list" style="display:none"></div>
<!-- 分析历史列表 -->
<div id="ai-history-list" style="display:none"></div>
<div id="ctx-menu"></div>
<div id="modal-overlay"><div id="modal-box"></div></div>
<div id="toast" class="toast"></div>

<script src="/static/js/klinecharts.min.js"></script>
<script src="/static/js/klinecharts-pro.umd.js"></script>
<script src="/static/js/mcp-bridge.js"></script>
<script src="/static/js/annotation-ui.js"></script>
<script src="/static/js/session-ui.js"></script>
<script>
const store = { activeCat:null, selected:null, categoryData:null, _seq:0, _expandedCats:{}, _catSortState:{} };
// 暴露给 session-ui / annotation-ui / MCP / 调试（脚本块内 const 默认不进 window）
window.store = store;
// 全局错误边界：防止单个JS错误打垮整个UI
window.addEventListener('error', function(e){console.warn('[ErrorBoundary]',e.message||e);e.preventDefault();});
window.addEventListener('unhandledrejection', function(e){console.warn('[ErrorBoundary]',e.reason);e.preventDefault();});
// 页面卸载时清理所有定时器（防止内存泄漏）
const _allTimers = new Set();
let _origSetInt = window.setInterval; window.setInterval = function(f,d,...a){const id=_origSetInt(f,d,...a);_allTimers.add(id);return id;};
let _origSetTO = window.setTimeout; window.setTimeout = function(f,d,...a){const id=_origSetTO(f,d,...a);_allTimers.add(id);return id;};
let _origClearInt = window.clearInterval; window.clearInterval = function(id){_allTimers.delete(id);return _origClearInt(id);};
window.addEventListener('beforeunload', function(){_allTimers.forEach(id=>clearInterval(id));_allTimers.clear();});
let pro = null;
const API = '';
window.API = API;
// 左侧板块导航栏收缩/展开
function toggleNavPanel(){
  document.getElementById('app').classList.toggle('nav-collapsed');
  var btn = document.getElementById('nav-panel-toggle');
  if (btn) btn.textContent = document.getElementById('app').classList.contains('nav-collapsed') ? '\u25B6' : '\u25C0';
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2500);}
/* 预先声明所有可能被初始化函数引用的变量（避免TDZ） */
let _analysisHistory = [];
const _historyKey = 'ai_analysis_history';
let _lastClickBoard=null;
let _lastClickTime=0;
let _pendingSym=0;
let _preloadDone = {};
let _currentReqId = 0;
let _aiPanelCache = null;
let _navPanelScroll = 0;
let _idxBarDragEl = null;
let _pinyinData = {};
let _sm = null;
// 类型样式（顶部已定义，这里只引用）
const _chartLoadingTimers = {};
function showToastBar(html){let el=document.getElementById('toast-bar');if(!el){el=document.createElement('div');el.id='toast-bar';el.className='toast-bar';document.body.appendChild(el);}el.innerHTML=html;el.classList.add('show');clearTimeout(el._bt);el._bt=setTimeout(()=>el.classList.remove('show'),15000);}

// ===== 1. 分类（支持持久化+拼音排序） =====
async function loadClassification() {
  const p=document.getElementById('nav-panel');
  try {
    const r=await fetch(API+'/api/classification/load');
    store.categoryData=(await r.json()).categories;
    renderNav();
  } catch(e){
    console.warn('分类加载失败', e);
    store.categoryData=[];
    p.innerHTML='<div class="nav-header" style="color:#ef5350">加载失败</div><div class="nav-item" onclick="loadClassification()">点此重试</div>';
  }
}

// 获取板块拼音排序键：取每个字的拼音首字母拼接
function _boardSortKey(name){
  if(!_pinyinData)return name;
  // 从本地搜索索引映射中查找
  const found = window._sm ? window._sm.find(s => s.name === name) : null;
  if(found && found.initials) return found.initials;
  // 从拼音数据中找任意匹配（旧版缓存兼容）
  for(const info of Object.values(_pinyinData)){
    if(info.name===name){
      return (info.initials||[]).join('');
    }
  }
  return name;
}

function renderNav(){
  const p=document.getElementById('nav-panel');
  if(!store.categoryData){
    p.innerHTML='<div class="nav-header">暂无数据</div><div class="nav-item" onclick="loadClassification()">点击重试</div>';
    return;
  }
  let total=0; store.categoryData.forEach(c=>total+=c.boards.length);
  let h='<div class="nav-header">板块分类 <span style="font-size:10px;color:#434651">('+total+'个)</span></div>';
  store.categoryData.forEach(cat=>{
    const id='cat_'+cat.name.replace(/[^a-zA-Z0-9\u4e00-\u9fff]/g,'_');
    const active=store.activeCat===cat.name?'active':'';
    const isExpanded = (store._expandedCats||{})[cat.name] || store.activeCat===cat.name;
    const arrowIcon = isExpanded ? '▼' : '▶';
    // 按拼音首字母排序：行业内按行业排序，概念内按概念排序
    const sorted=[...cat.boards].sort((a,b)=>{
      const ka=_boardSortKey(a.name), kb=_boardSortKey(b.name);
      return ka<kb?-1:ka>kb?1:0;
    });
    const sortDir = (store._catSortState||{})[cat.name];
    const sortIcon = sortDir==='desc'?'↓':sortDir==='asc'?'↑':'↕';
    const sortCls = 'cat-sort'+(sortDir?' active':'');
    h+='<div class="cat-item '+active+'" onclick="toggleCat(\''+id+'\',\''+escAttr(cat.name)+'\')"><span class="arrow">'+arrowIcon+'</span> '+escHtml(cat.name)+'<span class="count">'+cat.boards.length+'</span><span class="'+sortCls+'" onclick="toggleCatSort(\''+escAttr(cat.name)+'\',\''+id+'\',event)" title="涨跌幅排序">'+sortIcon+'</span></div>';
    h+='<div'+(isExpanded?'':' class="collapsed"')+' id="'+id+'">';
    sorted.forEach(b=>{
      const cls=b.type==='industry'?'type-i':'type-c';
      h+='<div class="board-item '+cls+'" data-code="'+b.code+'" data-type="'+b.type+'" data-name="'+escAttr(b.name)+'" data-chg="0" onclick="selectBoard(\''+escAttr(b.name)+'\',\''+b.code+'\',\''+b.type+'\',event)" oncontextmenu="showBoardCtx(event,\''+escAttr(b.name)+'\',\''+b.code+'\',\''+b.type+'\')"><span>'+escHtml(b.name)+'</span><span class="board-chg" data-bchg="'+b.code+'"></span></div>';
    });
    h+='</div>';
  });
  p.innerHTML=h;
  // 注入折叠按钮（每次 renderNav 后确保存在）
  if(!document.getElementById('nav-panel-toggle')){
    var tgl=document.createElement('button');
    tgl.id='nav-panel-toggle';
    tgl.title='折叠板块导航';
    tgl.textContent='\u25C0';
    tgl.onclick=function(){ toggleNavPanel(); };
    p.appendChild(tgl);
  }
}
function toggleCat(id,name){
  const el=document.getElementById(id); if(!el)return;
  const arrow=el.previousElementSibling.querySelector('.arrow');
  el.classList.toggle('collapsed');
  const isExpanded=!el.classList.contains('collapsed');
  arrow.textContent=isExpanded?'▼':'▶';
  if(isExpanded){
    store.activeCat=name;
    if(!store._expandedCats) store._expandedCats={};

// ===== 3. KLineChart Pro Datafeed（带请求取消+超时控制） =====
class BoardDatafeed {
  constructor(){
    this._timer=null;
    this._activeReqs=new Map();
    this._seq=0;
    // 全量序列缓存：避免 Pro 多次 getHistory 重拉/拼接导致同一日期循环展示
    this._cache=new Map();
  }
  async searchSymbols(search) {
    if(!store.categoryData) return [];
    const results = [];
    store.categoryData.forEach(cat => {
      cat.boards.forEach(b => {
        if (!search || b.name.includes(search) || b.code.includes(search)) {
          results.push({
            ticker: b.code, name: b.name, shortName: b.name,
            type: b.type, market: 'A', exchange: '中国', priceCurrency: 'CNY'
          });
        }
      });
    });
    return results;
  }
  _periodToApi(p) {
    const t=p.timespan, m=p.multiplier;
    if(t==='minute') return m+'m';
    if(t==='hour') return (m*60)+'m';
    if(t==='day') return 'daily';
    if(t==='week') return 'weekly';
    if(t==='month'){if(m===1)return 'monthly';if(m===3)return 'quarterly';if(m===12)return 'yearly';return 'monthly';}
    return 'daily';
  }
  _normalizeTs(v) {
    const n = Number(v);
    if (!isFinite(n) || n <= 0) return null;
    // 秒级 < 1e10，毫秒级 >= 1e10
    return n < 1e10 ? n * 1000 : n;
  }
  _dedupeSort(rows) {
    rows.sort((a, b) => a.timestamp - b.timestamp);
    const seen = new Set();
    return rows.filter(d => {
      if (seen.has(d.timestamp)) return false;
      seen.add(d.timestamp);
      return true;
    });
  }
  async getHistoryKLineData(symbol, period, from, to) {
    const mySeq = ++this._seq;
    // 取消同symbol+period的旧请求
    const symKey = symbol.ticker+':'+period.timespan+':'+period.multiplier;
    if(this._activeReqs.has(symKey)){this._activeReqs.get(symKey).abort();}
    const ctrl = new AbortController();
    this._activeReqs.set(symKey, ctrl);
    const p = this._periodToApi(period);
    const cacheKey = symKey + ':' + p;
    const tid = setTimeout(()=>ctrl.abort(), 15000);
    try {
      let rows = [];
      // 优先缓存：Pro 会多次回调；无缓存时每次全量返回易被内部拼接成「日期循环」
      if (this._cache.has(cacheKey)) {
        rows = this._cache.get(cacheKey).slice();
      } else {
        const r = await fetch(API+'/api/kline/'+(symbol.type||'industry')+'/'+symbol.ticker
          +'?name='+encodeURIComponent(symbol.name||symbol.shortName)+'&period='+p+'&timeout=15', {signal:ctrl.signal});
        clearTimeout(tid);
        this._activeReqs.delete(symKey);
        if(this._seq!==mySeq) return [];  // 已有更新的请求，丢弃当前结果
        const j = await r.json();
        if(j.loading) return [];
        if(j.error){console.warn('kline data error:',j.error);return [];}
        rows = (j.data||[]).map(d=>({
          timestamp:d.timestamp,open:d.open,high:d.high,low:d.low,close:d.close,volume:d.volume||0
        }));
        rows = this._dedupeSort(rows);
        this._cache.set(cacheKey, rows.slice());
      }
      // from/to：Pro 多为秒级，数据为毫秒
      if (rows.length && from != null && to != null) {
        const f = this._normalizeTs(from);
        const t = this._normalizeTs(to);
        if (f !== null && t !== null) {
          const lo = Math.min(f, t);
          const hi = Math.max(f, t);
          rows = rows.filter(d => d.timestamp >= lo && d.timestamp <= hi);
        }
      }
      rows = this._dedupeSort(rows);
      return rows;
    } catch(e) {
      clearTimeout(tid);
      this._activeReqs.delete(symKey);
      if(e.name==='AbortError'){console.warn('kline fetch timeout for',symbol.ticker);return [];}
      throw e;
    }
  }
  subscribe(symbol, period, callback) {
    clearInterval(this._timer);
    let _lastPushedPrice = 0;       // 去重：仅在价格变化时推送
    let _lastTradingTimestamp = 0;  // 固定时间戳：始终用最新交易日
    this._timer = setInterval(async () => {
      try {
        const ctrl = new AbortController();
        const t = setTimeout(()=>ctrl.abort(), 10000);
        const r = await fetch(API+'/api/spot/'+(symbol.type||'industry')+'/'+symbol.ticker,{signal:ctrl.signal});
        clearTimeout(t);
        if(!r.ok) return;
        const j = await r.json();
        const data = j.data && j.data.price ? j.data : null;
        if(data) {
          // 用最后一根K线的日期作为时间戳，避免周末/非交易日产生虚假新Bar
          if (!_lastTradingTimestamp) {
            // 首次：从图表获取最后一条数据的timestamp
            const chart = pro && pro._chart;
            const lastData = chart && chart.getDataList && chart.getDataList();
            if (lastData && lastData.length) {
              _lastTradingTimestamp = lastData[lastData.length-1].timestamp;
            }
          }
          const ts = _lastTradingTimestamp;
          if (!ts) return; // 尚无有效交易日时间戳，跳过推送（避免非交易日创建虚假新Bar）
          // 只有当价格变化时才推送
          if (Math.abs(data.price - _lastPushedPrice) > 0.001) {
            _lastPushedPrice = data.price;
            callback({timestamp:ts,close:data.price,open:data.open||data.price,high:data.high||data.price,low:data.low||data.price,volume:data.volume||0});
          }
        }
      } catch(e) { if(e.name!=='AbortError') console.warn('spot poll err:',e); }
    }, 30000);
  }
  unsubscribe(symbol, period) { clearInterval(this._timer); }
}
const _datafeed = new BoardDatafeed();

// ===== 4. 初始化 KLineChart Pro（带CDN重试机制） =====
let _pendingSymbol = null; // 等待pro初始化后应用的symbol
let _initProAttempts = 0;
const MAX_INIT_ATTEMPTS = 20; // 最多重试20次（约10秒）

function initPro() {
  const container = document.getElementById('pro-container');
  if (!container) return false;
  
  // CDN未加载 → 显示等待UI并自动重试
  if (!window.klinechartspro) {
    _initProAttempts++;

      // 最终失败：显示错误UI + 重试按钮

        '<div>KLineChart Pro 加载失败</div>'+
        '<div style="font-size:11px;color:#787b86;margin:8px 0">CDN资源可能被网络代理拦截</div>'+
        '<button onclick="forceReloadPro()" style="padding:6px 16px;border:1px solid #ef5350;border-radius:4px;background:transparent;color:#ef5350;cursor:pointer;font-size:12px">重新加载</button>'+
        '</div>';
      console.error('[Pro] CDN加载失败，已重试', MAX_INIT_ATTEMPTS, '次');
      return false;
    }
    // 显示等待状态
    if (_initProAttempts <= 3) {
      container.innerHTML = '<div class="placeholder" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#434651;font-size:14px;text-align:center">'+
        '<div style="font-size:24px;margin-bottom:8px">⏳</div>'+
        '正在加载KLineChart Pro...<br><span style="font-size:10px">('+_initProAttempts+'/'+MAX_INIT_ATTEMPTS+')</span>'+
        '</div>';
    }
    // 500ms后重试
    setTimeout(initPro, 500);
    return false;
  }
  
  // CDN已加载 → 初始化
  try {
    // 移除 placeholder
    const ph = container.querySelector('.placeholder');
    if (ph) ph.remove();

    // 劫持 klinecharts.init：Pro 内部会 init 真实 chart，供会话面板采集画线
    try {
      if (window.klinecharts && window.klinecharts.init && !window.__kline_init_patched) {
        const _origInit = window.klinecharts.init.bind(window.klinecharts);
        window.klinecharts.init = function(dom, opts) {
          const chart = _origInit(dom, opts);
          window.__kline_chart = chart;
          try {
            window.dispatchEvent(new CustomEvent('kline-chart-ready', { detail: chart }));
          } catch (e) {}
          return chart;
        };
        window.__kline_init_patched = true;
      }
    } catch (e) { console.warn('[Pro] init patch failed', e); }
    
    pro = new window.klinechartspro.KLineChartPro({
      container: container,
      theme: 'dark',
      locale: 'zh-CN',
      drawingBarVisible: true,
      watermark: null, // 去除水印
      // 蜡烛图：红涨绿跌（中国习惯）
      styles: {
        candle: {
          bar: {
            upColor: '#ef5350', upBorderColor: '#ef5350', upWickColor: '#ef5350',
            downColor: '#26a69a', downBorderColor: '#26a69a', downWickColor: '#26a69a'
          }
        },
        // 等间距K线，避免周末/节假日断点
        timeAxis: { type: 'bar' },
        // 成交量颜色跟随K线：红涨绿跌
        indicator: {
          bars: [{ upColor: 'rgba(239,83,80,0.7)', downColor: 'rgba(38,166,154,0.7)' }]
        }
      },
      // 默认加载上证指数
      symbol: { ticker: 'sh000001', name: '上证指数', shortName: '上证指数', type: 'index', market: 'A', priceCurrency: 'CNY' },
      period: { multiplier: 1, timespan: 'day', text: '日' },
      periods: [
        { multiplier: 1, timespan: 'minute', text: '1m' },
        { multiplier: 5, timespan: 'minute', text: '5m' },
        { multiplier: 15, timespan: 'minute', text: '15m' },
        { multiplier: 1, timespan: 'hour', text: '1H' },
        { multiplier: 2, timespan: 'hour', text: '2H' },
        { multiplier: 4, timespan: 'hour', text: '4H' },
        { multiplier: 1, timespan: 'day', text: '日' },
        { multiplier: 1, timespan: 'week', text: '周' },
        { multiplier: 1, timespan: 'month', text: '月' },
        { multiplier: 3, timespan: 'month', text: '季' },
        { multiplier: 12, timespan: 'month', text: '年' },
      ],
      timezone: 'Asia/Shanghai',

    });
    window.pro = pro;
    // 若劫持后已拿到 chart，再挂一次 draw-end 钩子入口
    if (window.__kline_chart) {
      console.log('[Pro] underlying chart ready', window.__kline_chart.id || '');
    } else {
      console.warn('[Pro] __kline_chart 未捕获，会话画线采集可能失败');
    }
    // 默认标的写入 store / ctx，供标注 UI 使用（此前仅 Pro 内部默认，外层未同步）
    if (!store.selected) {
      store.selected = { name: '上证指数', code: 'sh000001', type: 'index' };
    }
    window.__board_ctx = window.__board_ctx || {
      code: 'sh000001', type: 'index', name: '上证指数', period: 'daily', range: ''
    };
    window.__board_ctx.symbol = window.__board_ctx.code;
    toast('KLineChart Pro 就绪');
    // 右侧空白bar设为零，避免非交易日显示空区域
    try{ pro.setOffsetRightBarCount(0); }catch(e){}
    _initProAttempts = 0;
    
    // 监听 Pro 内置周期/标的切换 → 同步 __board_ctx（保证 hookCtxPoll 能检测到并 ensure_chart）
    _bindProContextSync();
    
    // 应用等待中的symbol
    if (_pendingSymbol) {
      setTimeout(() => {
        if (pro && pro.setSymbol) {
          pro.setSymbol(_pendingSymbol);
          loadSignals(_pendingSymbol.ticker);
        }
        _pendingSymbol = null;
      }, 100);
    }
    return true;
  } catch(e) {
    console.error('Pro init error:', e);
    toast('Pro 初始化失败: '+e.message);
    return false;
  }
}

// 将 Pro period 对象转为字符串
function _periodToCtx(p) {
  if (!p) return 'daily';
  if (p.timespan === 'day') return 'daily';
  if (p.timespan === 'week') return 'weekly';
  if (p.timespan === 'month') {
    if (p.multiplier === 3) return 'quarterly';
    if (p.multiplier === 12) return 'yearly';
    return 'monthly';
  }
  if (p.timespan === 'minute') return p.multiplier + 'm';
  if (p.timespan === 'hour') return p.multiplier * 60 + 'm';
  return 'daily';
}

// 将 Pro 内置的周期/标的切换同步到 __board_ctx
// KLineChart Pro 9.x 不支持 onPeriodChange/onSymbolChange → monkey-patch setSymbol/setPeriod
function _bindProContextSync() {
  if (!window.pro) return;
  try {
    const origSetSymbol = window.pro.setSymbol;
    if (origSetSymbol && !origSetSymbol.__ctx_patched) {
      window.pro.setSymbol = function(sym) {
        const result = origSetSymbol.apply(this, arguments);
        if (sym && window.__board_ctx) {
          window.__board_ctx.code = sym.ticker || '';
          window.__board_ctx.symbol = sym.ticker || '';
          window.__board_ctx.name = sym.name || sym.shortName || '';
          window.__board_ctx.type = sym.type || 'stock';
          try { window.__board_ctx.period = _periodToCtx(window.pro.getPeriod()); } catch(_) {}
          // 同步更新 store.selected（保持与顶部 bar 一致）
          if (window.store) { window.store.selected = { code: sym.ticker, name: sym.name || sym.shortName, type: sym.type || 'stock' }; }
          console.log('[Pro patch] symbol sync:', sym.ticker, '→', window.__board_ctx.period);
        }
        return result;
      };
      window.pro.setSymbol.__ctx_patched = true;
    }
    
    const origSetPeriod = window.pro.setPeriod;
    if (origSetPeriod && !origSetPeriod.__ctx_patched) {
      window.pro.setPeriod = function(p) {
        const result = origSetPeriod.apply(this, arguments);
        if (p && window.__board_ctx) {
          window.__board_ctx.period = _periodToCtx(p);
          console.log('[Pro patch] period sync:', window.__board_ctx.period);
        }
        return result;
      };
      window.pro.setPeriod.__ctx_patched = true;
    }
  } catch(e) {
    console.warn('[Pro] context sync bind failed:', e);
  }
}

// 强制重新加载Pro（用户点击重试按钮）
function forceReloadPro() {
  _initProAttempts = 0;
  if (_datafeed && _datafeed._cache) _datafeed._cache.clear();
  // 尝试重新注入CDN脚本
  if (!window.klinechartspro) {
    injectCDNScripts();
  }
  setTimeout(initPro, 300);
}

// CDN脚本注入（带fallback）
function injectCDNScripts() {
  const cdnBase = 'https://cdn.jsdelivr.net/npm';
  const altCdnBase = 'https://unpkg.com';
  
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  
  // 尝试主CDN，失败则用备用
  loadScript(`${cdnBase}/klinecharts@9.6.0/dist/klinecharts.min.js`)
    .then(() => loadScript(`${cdnBase}/@klinecharts/pro/dist/klinecharts-pro.umd.js`))
    .catch(() => {
      console.warn('[CDN] 主CDN失败，尝试备用');
      return loadScript(`${altCdnBase}/klinecharts@9.6.0/dist/klinecharts.min.js`)
        .then(() => loadScript(`${altCdnBase}/@klinecharts/pro/dist/klinecharts-pro.umd.js`));
    })
    .then(() => { console.log('[CDN] 脚本加载成功'); })
    .catch((e) => { console.error('[CDN] 所有CDN失败:', e); });
}

function toggleCatSort(catName, catId, event){
  event.stopPropagation(); // 不触发分类展开/折叠
  if(!store._expandedCats) store._expandedCats={};
  const state = store._catSortState[catName] || null;
  const next = state === 'desc' ? 'asc' : state === 'asc' ? null : 'desc';
  if(next) store._catSortState[catName] = next;
  else delete store._catSortState[catName];
  sortCatBoards(catId, next);
  // 内联更新图标（不重建DOM，避免丢失展开状态）
  var col = document.getElementById(catId);
  if(col){
    var sortEl = col.previousElementSibling.querySelector('.cat-sort');
    if(sortEl){
      sortEl.textContent = next==='desc'?'↓':next==='asc'?'↑':'↕';
      sortEl.className = 'cat-sort'+(next?' active':'');
    }
  }
}

function sortCatBoards(catId, direction){
  const col = document.getElementById(catId);
  if(!col) return;
  const items = Array.from(col.querySelectorAll('.board-item'));
  if(!direction){
    // 恢复原始拼音排序
    items.sort(function(a,b){
      const ka = _boardSortKey(a.dataset.name || '');
      const kb = _boardSortKey(b.dataset.name || '');
      return ka < kb ? -1 : ka > kb ? 1 : 0;
    });
  } else {
    items.sort(function(a,b){
      const ca = parseFloat(a.dataset.chg) || 0;
      const cb = parseFloat(b.dataset.chg) || 0;
      return direction === 'desc' ? cb - ca : ca - cb;
    });
  }
  items.forEach(function(el){ col.appendChild(el); });
}

    sr.innerHTML = renderSearchHistory();
    if(_searchHistory.length) sr.classList.add('show');
    else sr.classList.remove('show');

si.oninput = function(){
  const q = si.value.trim();
  if(!q){
    sr.innerHTML = renderSearchHistory();
    if(_searchHistory.length) sr.classList.add('show');
    else sr.classList.remove('show');
    sIdx = -1;
    return;
  }
  
  // 清除旧定时器
  if(_searchTimer) clearTimeout(_searchTimer);
  
  // 防抖 150ms
  _searchTimer = setTimeout(async () => {
    try {
      // 构建历史code列表用于置顶
      const historyCodes = _searchHistory.map(h => h.code).join(',');
      const r = await fetch(API+'/api/search?q='+encodeURIComponent(q)+
        (historyCodes ? '&history='+encodeURIComponent(historyCodes) : ''));
      const resp = await r.json();
      const matches = resp.data || [];
      
      if(!matches.length){
        sr.innerHTML = '<div style="padding:10px;color:#434651;font-size:11px;text-align:center">无匹配结果</div>';
        sr.classList.add('show');
        sIdx = -1;
        window._sm = [];
        return;
      }
      
      sr.innerHTML = matches.map((m,i) => renderSearchItem(m,i)).join('');
      sr.classList.add('show');
      sIdx = -1;
      window._sm = matches;
    } catch(e) {
      console.warn('[搜索] 请求失败:', e);
      sr.classList.remove('show');
    }
  }, 150);
};

function searchPick(i){
  const items = window._sm;
  if(!items || i < 0 || i >= items.length) return;
  const m = items[i];
  if(!m) return;
  
  // 记录搜索历史
  addSearchHistory(m.code, m.name, m.type, m.category);
  
  // 加载对应数据
  const boardType = searchTypeToBoardType(m.type, m.code);
  selectBoard(m.name, m.code, boardType, null);
  sr.classList.remove('show');
  si.value = '';
}

function searchPickHistory(i){
  loadSearchHistory();
  const h = _searchHistory[i];
  if(!h) return;
  const boardType = searchTypeToBoardType(h.type, h.code);
  selectBoard(h.name, h.code, boardType, null);
  sr.classList.remove('show');
  si.value = '';
}

si.onkeydown = function(e){
  const items = sr.querySelectorAll('.search-item');
  if(!sr.classList.contains('show') || items.length === 0) return;
  
  if(e.key === 'ArrowDown'){
    e.preventDefault();
    if(sIdx < items.length - 1){
      if(sIdx >= 0) items[sIdx].classList.remove('selected');
      sIdx++;
      items[sIdx].classList.add('selected');
      const t = items[sIdx].offsetTop, bh = sr.clientHeight;
      if(t + items[sIdx].offsetHeight > sr.scrollTop + bh) sr.scrollTop = t + items[sIdx].offsetHeight - bh;
      else if(t < sr.scrollTop) sr.scrollTop = t;
    }
  } else if(e.key === 'ArrowUp'){
    e.preventDefault();
    if(sIdx > 0){
      items[sIdx].classList.remove('selected');
      sIdx--;
      items[sIdx].classList.add('selected');
      const t = items[sIdx].offsetTop;
      if(t < sr.scrollTop) sr.scrollTop = t;
      else if(t + items[sIdx].offsetHeight > sr.scrollTop + sr.clientHeight)
        sr.scrollTop = t + items[sIdx].offsetHeight - sr.clientHeight;
    }
  } else if(e.key === 'Enter'){
    e.preventDefault();
    if(sIdx >= 0 && items[sIdx]){
      items[sIdx].click();
    } else if(items.length > 0){
      items[0].click();
    }
  } else if(e.key === 'Escape'){
    sr.classList.remove('show');
    si.blur();
  }
};

// ==== SSE 自动刷新（数据更新+AI分析+防抖） ====
(function(){
  let _sse = null;
  let _sseRetryCount = 0;
  const MAX_SSE_RETRY = 30;
  
  function connectSSE() {
    _sse = new EventSource('/api/events');
    
    _sse.onopen = () => {
      if (_sseRetryCount > 0) {
        console.log('[SSE] 重新连接成功');
        toast('实时推送已恢复');
      }
      _sseRetryCount = 0;
    };
    
    _sse.onerror = () => {
      console.warn('[SSE] 连接断开，尝试重连...');
      _sse.close();
      
      if (_sseRetryCount >= MAX_SSE_RETRY) {
        console.error('[SSE] 重试次数过多，停止重连');
        showToastBar('实时推送连接失败，请 <a href="#" onclick="location.reload()">刷新页面</a>');
        return;
      }
      
      // 指数退避：1s, 2s, 4s, 8s... 最多30s
      const delay = Math.min(1000 * Math.pow(2, _sseRetryCount), 30000);
      _sseRetryCount++;
      console.log(`[SSE] ${delay}ms后第${_sseRetryCount}次重连`);
      setTimeout(connectSSE, delay);
    };
  }
  
  connectSSE();
  
  
  // 数据更新
  _sse.addEventListener('data_updated', () => {
    console.log('[SSE] 数据已更新');
    toast('数据已更新');
    clearTimeout(_sseRefreshTimer);
    _sseRefreshTimer = setTimeout(() => {
      if (store.selected && pro && pro.setSymbol) {
        pro.setSymbol({
          ticker: store.selected.code, name: store.selected.name,
          type: store.selected.type, market: 'A', priceCurrency: 'CNY'
        });
      }
    }, 500);
  });
  
  _sse.addEventListener('data_updating', () => { toast('数据更新中...'); });
  
  // AI分析完成
  _sse.addEventListener('ai_result', (e) => {
    try{
      const d = JSON.parse(e.data);
      renderAiResult(d);
    }catch(e){ console.warn('ai_result parse error:', e); }
  });
  
  // 信号更新
  _sse.addEventListener('signals_updated', (e) => {
    try{
      const d = JSON.parse(e.data);
      if(store.selected && store.selected.code===d.board_code){
        loadSignals(d.board_code);
      }
    }catch(e){}
  });
  
  // 注意: onerror 已集成在 connectSSE 的重连机制中
  setTimeout(() => { if (store.selected) checkDataFreshness(); }, 2000);
})();

// ==== 数据新鲜度检查 ====
async function checkDataFreshness(){
  if (!store.selected) return;
  try {
    const r = await fetch(API+'/api/kline/'+store.selected.type+'/'+store.selected.code
      +'?name='+encodeURIComponent(store.selected.name)+'&period=daily');
    const j = await r.json();
    if (j.last_date) {
      const today = new Date();
      const lastDate = new Date(j.last_date);
      const diffDays = (today - lastDate) / 86400000;
      if (diffDays > 3) {
        toast('⚠️ 数据可能已过期（最后更新：'+j.last_date+'）');
      } else if (j.last_date !== today.toISOString().slice(0,10) && today.getHours() >= 15) {
        // 交易日已收盘但数据不是今天的，提示刷新
        showToastBar('数据可能不是最新的，点击 <a href="#" onclick="forceRefresh()">强制刷新</a>');
      }
    }
  } catch(e) {}
}

// ==== 强制刷新 ====
function forceRefresh(){
  closeCtx();
  if (_datafeed && _datafeed._cache) _datafeed._cache.clear();
  toast('正在强制刷新...');
  fetch(API+'/api/update/force', {method:'POST'})
    .then(r=>r.json())
    .then(j=>{
      if(j.ok) toast('全量更新已触发，请等待完成');
      document.getElementById('refresh-btn') && (document.getElementById('refresh-btn').disabled = false);
    })
    .catch(()=>toast('触发失败'));
}

})();
