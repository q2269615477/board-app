<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Panel Debug</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;background:#131722;color:#d1d4dc;font-size:12px;padding:10px}
.box{background:#1a1e29;border:1px solid #2a2e39;padding:8px;margin:8px 0;border-radius:4px}
.pass{color:#26a69a}.fail{color:#ef5350}pre{white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto}
button{background:#2962ff;color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;margin:4px}
#test-nav{background:#131722;border:1px solid #2a2e39;min-height:200px;overflow:auto;max-height:300px}
.board-item{padding:4px 10px;border-bottom:1px solid #1e2230;cursor:pointer;display:flex;justify-content:space-between;font-size:11px}
.board-item:hover{background:#1e2230}
</style>
</head>
<body>
<h2 style="margin:10px 0">AI炒股面板完整数据链路诊断</h2>
<div id="log"></div>

<!-- ===== 板块导航测试区 ===== -->
<div class="box" style="margin-top:10px">
<h3>板块导航测试</h3>
<div id="test-nav">加载分类数据中...</div>
</div>

<!-- ===== KLineChart 测试区 ===== -->
<div class="box">
<h3>KLineChart Pro 加载测试</h3>
<div id="chart-status">等待测试...</div>
<div id="chart" style="height:300px;border:1px solid #2a2e39;margin-top:8px"></div>
</div>

<script>
function log(msg, cls) {
  const el = document.getElementById('log');
  el.innerHTML += '<div class="'+(cls||'')+'">['+new Date().toLocaleTimeString().slice(0,8)+'] '+msg+'</div>';
  el.scrollTop = el.scrollHeight;
}

// ---- 步骤1: 测试分类API ----
async function testClassification() {
  try {
    const r = await fetch('/api/classification/load');
    if (!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if (!j.categories || !j.categories.length) throw new Error('categories is empty');
    const count = j.categories.reduce((a,c)=>a+(c.boards||[]).length,0);
    log('API /api/classification/load → '+j.categories.length+' 分类, '+count+' 板块', 'pass');
    return j;
  } catch(e) {
    log('API /api/classification/load 失败: '+e.message, 'fail');
    // 测试静态文件
    try {
      const r2 = await fetch('/static/board_classification.json');
      const j2 = await r2.json();
      log('Fallback /static/board_classification.json → '+j2.length+' 分类', 'pass');
      return {categories: j2};
    } catch(e2) {
      log('Fallback 也失败: '+e2.message, 'fail');
      return null;
    }
  }
}

// ---- 步骤2: 测试板块渲染 ----
function testRenderNav() {
  if (typeof renderNav !== 'function') {
    log('renderNav 函数不存在（内联脚本可能未加载）', 'fail');
    return false;
  }
  try {
    renderNav();
    document.getElementById('test-nav').innerHTML = '(renderNav() 已执行，但结果见左侧nav-panel)';
    log('renderNav() 调用成功', 'pass');
    return true;
  } catch(e) {
    log('renderNav() 报错: '+e.message, 'fail');
    return false;
  }
}

// ---- 步骤3: 测试 KLineChart Pro ----
function testKLineChart() {
  const status = document.getElementById('chart-status');
  let msg = '';
  
  if (!window.klinechartspro) {
    msg = '❌ window.klinechartspro = undefined（内联脚本未执行）';
    status.innerHTML = msg; log(msg, 'fail');
    return false;
  }
  
  if (!window.klinechartspro.KLineChartPro) {
    msg = '❌ window.klinechartspro.KLineChartPro = undefined';
    status.innerHTML = msg; log(msg, 'fail');
    return false;
  }
  
  msg = '✅ KLineChartPro 类可用，尝试初始化...';
  status.innerHTML = msg; log(msg, 'pass');
  
  try {
    const chart = new window.klinechartspro.KLineChartPro({
      container: document.getElementById('chart'),
      theme: 'dark',
      symbol: { ticker:'sh000001', name:'上证指数' },
      period: { multiplier:1, timespan:'day', text:'日' },
      datafeed: {
        getHistoryKLineData: async (sym, per, from, to) => {
          try {
            const r = await fetch('/api/kline/index/'+sym.ticker+'?period=1d');
            const j = await r.json();
            return j.data || [];
          } catch(e) { return []; }
        },
        subscribe: () => {},
        unsubscribe: () => {}
      }
    });
    msg = '✅ KLineChart Pro 实例创建成功';
    status.innerHTML = msg; log(msg, 'pass');
    return true;
  } catch(e) {
    msg = '❌ KLineChart Pro 初始化失败: '+e.message;
    status.innerHTML = msg; log(msg, 'fail');
    return false;
  }
}

// ---- 步骤4: 测试指数API ----
async function testIndices() {
  try {
    const r = await fetch('/api/spot/indices');
    const j = await r.json();
    log('API /api/spot/indices → 返回数据, keys='+Object.keys(j).slice(0,5).join(', '), 'pass');
    return j;
  } catch(e) {
    log('API /api/spot/indices 失败: '+e.message, 'fail');
    return null;
  }
}

(async function main() {
  log('开始完整数据链路测试...');
  
  const cls = await testClassification();
  if (cls) {
    // 手动渲染测试
    const nav = document.getElementById('test-nav');
    let html = '';
    cls.categories.forEach(cat => {
      html += '<div style="background:#2962ff;padding:4px 8px;margin:4px 0;border-radius:2px;font-weight:600">'+cat.name+'</div>';
      (cat.boards||[]).slice(0,5).forEach(b => {
        html += '<div class="board-item"><span>'+b.name+'</span><span style="color:#434651">'+b.code+'</span></div>';
      });
    });
    nav.innerHTML = html || '<div style="color:#434651">分类数据为空</div>';
    log('手动渲染板块导航 → 完成', 'pass');
  }
  
  testRenderNav();
  testKLineChart();
  testIndices();
})();
</script>
</body>
</html>
